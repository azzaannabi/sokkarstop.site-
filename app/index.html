<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sokkar Coach</title>
<meta name="theme-color" content="#F4EBDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sokkar Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none" stroke="#A33A2E" stroke-width="3"/><path d="M24 13.5l8.5 4.8v9.4L24 32.5l-8.5-4.8v-9.4z" fill="#A33A2E" opacity=".92"/><path d="M11.5 36.5L36.5 11.5" stroke="#F4EBDB" stroke-width="6" stroke-linecap="round"/><path d="M11.5 36.5L36.5 11.5" stroke="#A33A2E" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="wordmark" dir="ltr"><span>SOKKAR</span><span>COACH</span></span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" data-act="sound" type="button"></button>
      <div class="seg-lang" role="group" aria-label="Langue / اللغة">
        <button type="button" data-act="setlang" data-v="fr" aria-pressed="true">FR</button>
        <button type="button" data-act="setlang" data-v="ar" aria-pressed="false">AR</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav id="tabbar" class="tabbar" aria-label="Menu" hidden></nav>

<input type="file" id="foodPick" class="pick" accept="image/*">
<input type="file" id="foodCam" class="pick" accept="image/*" capture="environment">
<input type="file" id="bodyPick" class="pick" accept="image/*">
<input type="file" id="bodyCam" class="pick" accept="image/*" capture="environment">

<div id="alarm" class="alarm" role="alertdialog" aria-modal="true" aria-labelledby="alarmTitle" hidden>
  <svg class="stop-sign" viewBox="0 0 100 100" aria-hidden="true"><polygon points="30,3 70,3 97,30 97,70 70,97 30,97 3,70 3,30"/><text x="50" y="58" text-anchor="middle">STOP</text></svg>
  <h2 id="alarmTitle">Sokkar Stop</h2>
  <p id="alarmText"></p>
  <p id="alarmTip" class="alarm-tip"></p>
  <div id="alarmChoices" class="choices"></div>
</div>

<noscript><p style="padding:24px;font-family:sans-serif">Cette appli a besoin de JavaScript.</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
